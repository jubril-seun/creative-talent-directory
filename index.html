<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folio Talent Directory</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel ="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-bar">
            <h1>Folio</h1>
            <nav>
                <ul>
                    <li><a href="#">Discover</a></li>
                    <li><a href="#">Disiplines</a></li>
                    <li><a href="#">Hiring</a></li>
                </ul>
            </nav>
            <button>Sign up</button>
        </div>
        <hr class="divider">
    </header>

    <section class="search-section">
        <h1>Discover creative talent</h1>
        <p>Browse designers, developers, and directors. Find the right collaborator for your next project.</p>
        <div class="search-bar">
            <input
                type="Search"
                id="mySearch"
                name="q"
                placeholder="Search by name, role, or skill..."/>
            <button>Search</button>
        </div>
        <hr class="divider">
    </section>

    <section class="filter-section">
        <div class="filter-items">
            <div class="filters">
                <p>Filter</p>
                <button>All</button>
                <button>Motion</button>
                <button>UX</button>
                <button>Dev</button>
                <button>Branding</button>
                <button>Illustration</button>
            </div>
            <p>6 members</p>
        </div>
        <hr class="divider">
    </section>
</body>
</html>
